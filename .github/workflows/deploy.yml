name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🏗️ Typecheck & Build project
        run: npm run build

      - name: 📄 Ensure root .htaccess is in dist
        run: |
          if [ -f ".htaccess" ] && [ ! -f "dist/.htaccess" ]; then
            cp .htaccess dist/
          elif [ -f "public/.htaccess" ] && [ ! -f "dist/.htaccess" ]; then
            cp public/.htaccess dist/
          fi

      - name: 📂 Ensure API scripts are in dist
        run: |
          if [ -d "public/api" ] && [ ! -d "dist/api" ]; then
            cp -r public/api dist/
          fi

      - name: 🚀 Sync & Deploy to cPanel (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          dangerous-clean-slate: false
